<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Travel Hub 5572</title>
<meta name="description" content="Shadow Travel Hub 5572 - safe, on-time cab and travel service from Ooty to Coimbatore, airport transfers and sightseeing across South India.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10201a;
  --forest:#16402f;
  --leaf:#2f7d4f;
  --amber:#f2a516;
  --mist:#f3f6f1;
  --paper:#ffffff;
  --muted:#5b6b63;
  --line:#dbe3dc;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6;font-size:16px}
h1,h2,h3{font-family:'Bricolage Grotesque','Hanken Grotesk',sans-serif;line-height:1.15}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
section{padding:64px 0}
h2{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:800;margin-bottom:12px}
.lead{color:var(--muted);max-width:60ch;margin-bottom:32px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--forest);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.15rem;text-decoration:none}
.brand span{color:var(--amber)}
nav{display:flex;gap:18px;font-size:.95rem}
nav a{text-decoration:none;opacity:.9}
nav a:hover{opacity:1;text-decoration:underline}
@media(max-width:640px){nav a:not(.keep){display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid transparent;cursor:pointer;font-size:1rem;font-family:inherit}
.btn-call{background:var(--amber);color:var(--ink)}
.btn-wa{background:#25a244;color:#fff}
.btn-ghost{border-color:rgba(255,255,255,.6);color:#fff}
.btn:hover{filter:brightness(1.07)}

/* hero */
.hero{background:linear-gradient(rgba(10,28,20,.62),rgba(10,28,20,.82)),url('car1.jpg') center/cover,var(--forest);color:#fff;padding:84px 0 72px}
.hero h1{font-size:clamp(2.2rem,8vw,4rem);font-weight:800;max-width:14ch}
.route{display:flex;align-items:center;gap:12px;margin:18px 0 8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:1.25rem}
.route i{flex:0 0 56px;height:3px;background:var(--amber);border-radius:2px;position:relative}
.route i::after{content:"";position:absolute;right:-1px;top:-4px;border-left:9px solid var(--amber);border-top:5.5px solid transparent;border-bottom:5.5px solid transparent}
.hero p{max-width:50ch;opacity:.92;margin-bottom:26px}
.cta{display:flex;flex-wrap:wrap;gap:12px}

/* about */
.about{display:grid;gap:28px}
@media(min-width:760px){.about{grid-template-columns:1.2fr 1fr;align-items:start}}
.facts{background:var(--mist);border-radius:18px;padding:22px;display:grid;gap:14px}
.facts div b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:1.05rem}
.facts div span{color:var(--muted);font-size:.95rem}

/* services */
.services{background:var(--mist)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h3{font-size:1.15rem;margin-bottom:6px}
.card p{color:var(--muted);font-size:.95rem}
.card.main{background:var(--forest);color:#fff;border-color:var(--forest)}
.card.main p{color:#cfe0d6}

/* cars */
.cars{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.cars{grid-template-columns:repeat(6,1fr)}.cars figure:nth-child(1),.cars figure:nth-child(2){grid-column:span 3}.cars figure:nth-child(n+3){grid-column:span 2}}
.cars figure{border-radius:16px;overflow:hidden;background:var(--forest);aspect-ratio:4/3;position:relative}
.cars img{width:100%;height:100%;object-fit:cover}
.cars figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;color:#fff;font-weight:700;font-size:.9rem;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.cars figure:nth-child(1){grid-column:span 2}
@media(min-width:760px){.cars figure:nth-child(1){grid-column:span 3}}

.why{background:var(--forest);color:#fff}
